server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: localhost

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/qiju_furniture?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000

logging:
  level:
    com.qiju.furniture: debug

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:qiju-furniture}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

# 微信小程序配置
wechat:
  appid: wx69d67f33abf22596
  secret: ""  # 生产环境需要填写 AppSecret
  dev-mode: true  # 开发模式下跳过微信验证
